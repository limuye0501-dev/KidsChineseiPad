name: TestFlight
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  testflight:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      TEAM_ID: D53V28KTGW
      BUNDLE_ID: com.limuye.littlepandachinese
      PROFILE_NAME: Little Panda Chinese AppStore CI
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode_*.app
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -viE "beta|RC" | sort -V | tail -1)
          [ -n "$XC" ] || { echo NO_XCODE_26; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: ASC API key
        env:
          P8_B64: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$P8_B64" ]; then
            echo "ASC_KEY_ID or ASC_KEY_P8 is not set on this repository."
            exit 1
          fi
          mkdir -p ~/private_keys
          KP=~/private_keys/AuthKey_${KEY_ID}.p8
          echo "$P8_B64" | base64 --decode > "$KP"
          echo "ASC_KEY_PATH=$KP" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
      - name: Import distribution certificate
        env:
          P12_B64: ${{ secrets.DIST_CERT_P12 }}
          P12_PASS: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ] || [ -z "$P12_PASS" ]; then
            echo "DIST_CERT_P12 or DIST_CERT_PASSWORD is not set on this repository."
            exit 1
          fi
          KC=$RUNNER_TEMP/b.keychain-db
          KCP=$(openssl rand -hex 12)
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/d.p12"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security import "$RUNNER_TEMP/d.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"
      - name: Ensure bundle id and App Store profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 tools/ensure_asc_profile.py
      - name: Archive (manual signing)
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          BUILD_NUMBER=$(( ${{ github.run_number }} + 9 ))
          echo "TestFlight build number ${BUILD_NUMBER} (run_number + 9)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          xcodebuild archive -project LittlePandaChinese.xcodeproj -scheme LittlePandaChinese -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            APP_PROFILE="$PROFILE_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)|rovision" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: Export and upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          plist = {
              "method": "app-store-connect",
              "destination": "upload",
              "teamID": os.environ["TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
              "uploadSymbols": True,
              "manageAppVersionAndBuildNumber": False,
          }
          with open("EO.plist", "wb") as handle:
              plistlib.dump(plist, handle)
          PY
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist EO.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee export.log
          grep -qE "EXPORT SUCCEEDED|Upload succeeded" export.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: "*.log"
