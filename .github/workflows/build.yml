name: iOS Simulator Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check episode scripts
        run: python3 tools/validate_episodes.py
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode_*.app
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -viE "beta|RC" | sort -V | tail -1)
          [ -n "$XC" ] || { echo NO_XCODE_26; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project LittlePandaChinese.xcodeproj -scheme LittlePandaChinese -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ipads = []
          for runtime, group in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in group:
                  if device.get("isAvailable") and "iPad" in device.get("name", ""):
                      ipads.append(device)
          if not ipads:
              sys.exit("no iPad simulator")
          ipads.sort(key=lambda d: (0 if "iPad Pro" in d["name"] else 1, 0 if "13" in d["name"] else 1, d["name"]))
          print(ipads[0]["udid"])
          ')
          echo "iPad simulator $UDID"
          xcodebuild test -project LittlePandaChinese.xcodeproj -scheme LittlePandaChinese -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|TEST (SUCCEEDED|FAILED)|failed" || true
          grep -q "TEST SUCCEEDED" test.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            test.log
  screenshots:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -viE "beta|RC" | sort -V | tail -1)
          [ -n "$XC" ] || { echo NO_XCODE_26; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -project LittlePandaChinese.xcodeproj -scheme LittlePandaChinese -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee shot-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" shot-build.log
      - name: Capture iPad screenshots
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ipads = []
          for runtime, group in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in group:
                  if device.get("isAvailable") and "iPad" in device.get("name", ""):
                      ipads.append(device)
          if not ipads:
              sys.exit("no iPad simulator")
          ipads.sort(key=lambda d: (0 if "iPad Pro" in d["name"] else 1, 0 if "13" in d["name"] else 1, d["name"]))
          print(ipads[0]["udid"])
          ')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          APP="build/Build/Products/Debug-iphonesimulator/LittlePandaChinese.app"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          capture() {
            local name="$1" screen="$2" pause="$3"
            xcrun simctl terminate "$UDID" com.limuye.littlepandachinese 2>/dev/null || true
            xcrun simctl launch "$UDID" com.limuye.littlepandachinese -LPCScreen "$screen" -AppleLanguages "(en)" -AppleLocale en_US
            sleep "$pause"
            xcrun simctl io "$UDID" screenshot "shots/${name}.png"
            w=$(sips -g pixelWidth "shots/${name}.png" | awk '/pixelWidth/{print $2}')
            h=$(sips -g pixelHeight "shots/${name}.png" | awk '/pixelHeight/{print $2}')
            if [ "$w" -lt "$h" ]; then sips -r 270 "shots/${name}.png" >/dev/null; fi
          }
          capture 01-home home 6
          capture 02-title title 6
          capture 03-quiz quiz 6
          capture 04-joke joke 6
          capture 05-parent-gate gate 6
      - uses: actions/upload-artifact@v4
        with:
          name: ipad-screenshots
          path: shots
