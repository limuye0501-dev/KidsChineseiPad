name: LittlePandaChinese
options:
  bundleIdPrefix: com.limuye
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    BUNDLE_ID: com.limuye.littlepandachinese # rename the app here
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: D53V28KTGW
    CODE_SIGN_STYLE: Automatic
targets:
  LittlePandaChinese:
    type: application
    platform: iOS
    sources:
      - path: LittlePandaChinese
        excludes:
          - Products.storekit
          - "**/*.md"
      - path: LittlePandaChinese/Products.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: LittlePandaChinese/Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE)
    scheme:
      storeKitConfiguration: LittlePandaChinese/Products.storekit
      testTargets:
        - LittlePandaChineseTests
  LittlePandaChineseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LittlePandaChineseTests
      - path: LittlePandaChinese/Resources/Episodes
        buildPhase: resources
    dependencies:
      - target: LittlePandaChinese
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LittlePandaChinese.app/LittlePandaChinese
        BUNDLE_LOADER: $(TEST_HOST)
